name: PR issue link

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: read

concurrency:
  group: pr-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue:
    name: Linked GitHub Issue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout or contributor code is needed to inspect PR metadata.
      - name: Verify an explicit issue reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          body = event["pull_request"].get("body") or ""
          body = re.sub(r"<!--[\s\S]*?-->", "", body)
          visible_lines = []
          fence = None
          for line in body.splitlines():
              if fence:
                  if re.fullmatch(r" {0,3}" + re.escape(fence[0]) + "{" + str(len(fence)) + r",}[ \t]*", line):
                      fence = None
                  continue
              opening = re.match(r"^ {0,3}(`{3,}|~{3,})", line)
              if opening:
                  fence = opening[1]
              elif not line.startswith(("    ", "\t")):
                  visible_lines.append(line)
          body = "\n".join(visible_lines)
          repository = event["repository"]["full_name"]
          # Require an explicit, visible tracking line, not arbitrary #numbers.
          pattern = re.compile(
              r"^ {0,3}(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs)[ \t]*:?[ \t]+"
              r"(?:https://github\.com/(?P<url_repo>[\w.-]+/[\w.-]+)/issues/"
              r"|(?:(?P<short_repo>[\w.-]+/[\w.-]+))?#)"
              r"(?P<number>[1-9][0-9]*)(?=$|[\s.,;)])",
              re.IGNORECASE | re.MULTILINE,
          )
          references = {
              (match["url_repo"] or match["short_repo"] or repository, match["number"])
              for match in pattern.finditer(body)
          }
          if not references:
              raise SystemExit("Add a PR body line such as 'Closes #123' or 'Refs #123' linking a GitHub Issue.")

          for repo, number in sorted(references):
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{repo}/issues/{number}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      issue = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"Issue {repo}#{number} is missing or inaccessible.")
                      continue
                  raise
              if "pull_request" not in issue:
                  print(f"Linked issue verified: {issue['html_url']}")
                  break
              print(f"{repo}#{number} is a pull request, not an issue.")
          else:
              raise SystemExit("At least one tracking reference must resolve to an accessible GitHub Issue.")
